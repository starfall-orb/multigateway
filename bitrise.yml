# ==============================================================================
# Bitrise CI configuration for MultiGateway
# ==============================================================================
# Equivalent to codemagic.yaml, using Linux stack (Ubuntu + Android SDK).
#
# Bitrise Secrets to configure (Bitrise UI → Workflow → Secrets):
#   - SSH_RSA_PRIVATE_KEY         (optional, for private repos)
#   - BITRISE_KEYSTORE_PATH       (auto-set when uploading keystore file)
#   - BITRISE_KEYSTORE_PASSWORD   (Secret)
#   - BITRISE_KEY_ALIAS           (Secret)
#   - BITRISE_KEY_PASSWORD        (Secret)
#   - GITHUB_TOKEN                (Secret, for GitHub Release publishing)
#
# IMPORTANT: build.gradle.kts uses CM_KEYSTORE_* env vars, so a mapping step
# exports BITRISE_KEYSTORE_* → CM_KEYSTORE_* before Gradle runs.
# ==============================================================================

---
format_version: "13"
default_step_lib_source: "https://github.com/bitrise-io/bitrise-steplib.git"
project_type: "android"

# ----------------------------------------------------------------------------
# Stack: Linux Docker Android (Ubuntu + Android SDK)
# Alternatives:
#   - linux-docker-android-20.04  (Ubuntu 20.04)
#   - linux-docker-android-2024.04
#   - Custom image: stack: { image: "<docker-image>" }
# ----------------------------------------------------------------------------

workflows:
  # ---------------------------------------------------------------------------
  # ANDROID DEBUG
  # ---------------------------------------------------------------------------
  android_debug:
    title: MultiGateway Android Debug
    summary: |
      Build debug APK, run unit tests and lint.
      Equivalent to `android-debug` in codemagic.yaml, running on Linux.
    stack: linux-docker-android-2024.04
    timeout: 60
    envs:
      - GRADLE_OPTS: "-Xmx2048m -Dorg.gradle.daemon=false"
      - BITRISE_ANDROID_SDK_VERSION: "37"
      - BITRISE_ANDROID_BUILD_TOOLS_VERSION: "36.0.0"

    steps:
      - meta@1:
          inputs:
            - meta_title: "MultiGateway Android Debug"

      - activate-ssh-key@4:
          run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'

      - git-clone@8: {}

      - cache-pull@6:
          inputs:
            - cache_paths: |-
                ~/.gradle/caches
                ~/.gradle/wrapper
                $BITRISE_SOURCE_DIR/app/build/intermediates
                $BITRISE_SOURCE_DIR/app/build/outputs

      - set-java-version@1:
          inputs:
            - set_java_version: "21"

      - script@1:
          title: Set up Android SDK 37
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -euo pipefail
                SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
                if [ ! -x "$SDKMANAGER" ]; then
                  SDKMANAGER="$(command -v sdkmanager)"
                fi
                yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
                "$SDKMANAGER" "platforms;android-${BITRISE_ANDROID_SDK_VERSION}.0" "build-tools;${BITRISE_ANDROID_BUILD_TOOLS_VERSION}"
                printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > "$BITRISE_SOURCE_DIR/local.properties"

      - gradle-runner@2:
          title: Run unit tests
          inputs:
            - gradle_file: "$BITRISE_SOURCE_DIR/build.gradle.kts"
            - gradle_task: ":app:testDebugUnitTest"

      - gradle-runner@2:
          title: Run lint
          inputs:
            - gradle_file: "$BITRISE_SOURCE_DIR/build.gradle.kts"
            - gradle_task: ":app:lintDebug"

      - gradle-runner@2:
          title: Build debug APK
          inputs:
            - gradle_file: "$BITRISE_SOURCE_DIR/build.gradle.kts"
            - gradle_task: ":app:assembleDebug"

      - script@1:
          title: Rename debug APK
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -euo pipefail
                cd "$BITRISE_SOURCE_DIR"
                python3 scripts/name-apks.py app/build/outputs/apk/debug MultiGateway-debug.apk

      - cache-push@6:
          inputs:
            - cache_paths: |-
                ~/.gradle/caches
                ~/.gradle/wrapper
                $BITRISE_SOURCE_DIR/app/build/intermediates

      - deploy-to-bitrise-io@2: {}

  # ---------------------------------------------------------------------------
  # ANDROID RELEASE
  # ---------------------------------------------------------------------------
  android_release:
    title: MultiGateway Android Release
    summary: |
      Build signed release APK and publish to GitHub Release.
      Equivalent to `android-release` in codemagic.yaml, running on Linux.
    stack: linux-docker-android-2024.04
    timeout: 60
    envs:
      - GRADLE_OPTS: "-Xmx2048m -Dorg.gradle.daemon=false"
      - BITRISE_ANDROID_SDK_VERSION: "37"
      - BITRISE_ANDROID_BUILD_TOOLS_VERSION: "36.0.0"
      - GITHUB_RELEASE_REPO: "starfall-org/multigateway"

    steps:
      - meta@1:
          inputs:
            - meta_title: "MultiGateway Android Release"

      - activate-ssh-key@4:
          run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'

      - git-clone@8: {}

      - cache-pull@6:
          inputs:
            - cache_paths: |-
                ~/.gradle/caches
                ~/.gradle/wrapper
                $BITRISE_SOURCE_DIR/app/build/intermediates
                $BITRISE_SOURCE_DIR/app/build/outputs

      - set-java-version@1:
          inputs:
            - set_java_version: "21"

      - script@1:
          title: Set up Android SDK 37
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -euo pipefail
                SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
                if [ ! -x "$SDKMANAGER" ]; then
                  SDKMANAGER="$(command -v sdkmanager)"
                fi
                yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
                "$SDKMANAGER" "platforms;android-${BITRISE_ANDROID_SDK_VERSION}.0" "build-tools;${BITRISE_ANDROID_BUILD_TOOLS_VERSION}"
                printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > "$BITRISE_SOURCE_DIR/local.properties"

      - script@1:
          title: Check release signing credentials
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -euo pipefail
                : "${BITRISE_KEYSTORE_PATH:?Missing BITRISE_KEYSTORE_PATH (keystore file)}"
                : "${BITRISE_KEYSTORE_PASSWORD:?Missing BITRISE_KEYSTORE_PASSWORD}"
                : "${BITRISE_KEY_ALIAS:?Missing BITRISE_KEY_ALIAS}"
                : "${BITRISE_KEY_PASSWORD:?Missing BITRISE_KEY_PASSWORD}"
                test -f "$BITRISE_KEYSTORE_PATH"

      - script@1:
          title: Map BITRISE_KEYSTORE_* → CM_KEYSTORE_* for Gradle
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -euo pipefail
                export CM_KEYSTORE_PATH="$BITRISE_KEYSTORE_PATH"
                export CM_KEYSTORE_PASSWORD="$BITRISE_KEYSTORE_PASSWORD"
                export CM_KEY_ALIAS="$BITRISE_KEY_ALIAS"
                export CM_KEY_PASSWORD="$BITRISE_KEY_PASSWORD"
                echo "CM_KEYSTORE_PATH=$CM_KEYSTORE_PATH" >> "$BITRISE_ENV_FILE"
                echo "CM_KEYSTORE_PASSWORD=$CM_KEYSTORE_PASSWORD" >> "$BITRISE_ENV_FILE"
                echo "CM_KEY_ALIAS=$CM_KEY_ALIAS" >> "$BITRISE_ENV_FILE"
                echo "CM_KEY_PASSWORD=$CM_KEY_PASSWORD" >> "$BITRISE_ENV_FILE"

      - gradle-runner@2:
          title: Build release APK
          inputs:
            - gradle_file: "$BITRISE_SOURCE_DIR/build.gradle.kts"
            - gradle_task: ":app:assembleRelease"

      - script@1:
          title: Rename release APK & compute SHA-1
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -euo pipefail
                cd "$BITRISE_SOURCE_DIR"
                python3 scripts/name-apks.py app/build/outputs/apk/release MultiGateway.apk

      - script@1:
          title: Extract version name for release tag
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -euo pipefail
                GITHUB_RELEASE_TAG="$(python3 -c 'import json; print(json.load(open("app/build/outputs/apk/release/output-metadata.json"))["elements"][0]["versionName"])')"
                echo "GITHUB_RELEASE_TAG=$GITHUB_RELEASE_TAG" >> "$BITRISE_ENV_FILE"

      - script@1:
          title: Install GitHub CLI (Linux)
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -euo pipefail
                if ! command -v gh >/dev/null 2>&1; then
                  curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
                    | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
                  chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
                  echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
                    > /etc/apt/sources.list.d/github-cli.list
                  apt-get update -y
                  apt-get install -y gh
                fi
                gh --version

      - script@1:
          title: Publish to GitHub Release
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -euo pipefail
                export GH_TOKEN="${GITHUB_TOKEN:?Missing GITHUB_TOKEN secret in Bitrise workflow}"
                cd "$BITRISE_SOURCE_DIR"
                bash scripts/publish-github-release.sh

      - cache-push@6:
          inputs:
            - cache_paths: |-
                ~/.gradle/caches
                ~/.gradle/wrapper
                $BITRISE_SOURCE_DIR/app/build/intermediates

      - deploy-to-bitrise-io@2: {}

# ----------------------------------------------------------------------------
# Triggers: auto-run workflows
# ----------------------------------------------------------------------------
triggers:
  - push_branch: main
    workflow: android_debug
  - tag: "*"
    workflow: android_release