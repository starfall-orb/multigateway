workflows:
  android-debug:
    name: MultiGateway Android Debug
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Set up Android SDK 36
        script: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Build debug APK
        script: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon --stacktrace
          python3 scripts/name-apks.py app/build/outputs/apk/debug MultiGateway-debug.apk
    artifacts:
      - app/build/outputs/apk/debug/MultiGateway-debug.apk

  android-release:
    name: MultiGateway Android Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      java: 17
      groups:
        - github_release
      vars:
        GITHUB_RELEASE_REPO: starfall-orb/multigateway
      android_signing:
        - MultiGateway
    scripts:
      - name: Set up Android SDK 36
        ignore_failure: false
        script: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Check release signing credentials
        ignore_failure: false
        script: |
          set -euo pipefail
          : "${CM_KEYSTORE_PATH:?Missing keystore path}"
          : "${CM_KEYSTORE_PASSWORD:?Missing keystore password}"
          : "${CM_KEY_ALIAS:?Missing key alias}"
          : "${CM_KEY_PASSWORD:?Missing key password}"
          test -f "$CM_KEYSTORE_PATH"
      - name: Prepare GitHub release publishing
        ignore_failure: false
        script: |
          set -euo pipefail
          GITHUB_RELEASE_TOKEN="${GH_TOKEN:-${GITHUB_TOKEN:-}}"
          : "${GITHUB_RELEASE_TOKEN:?Set secret GITHUB_TOKEN (or GH_TOKEN) in environment group github_release}"
          if ! command -v gh >/dev/null 2>&1; then
            brew install gh --quiet
          fi
          gh --version >/dev/null
      - name: Build release APK
        ignore_failure: false
        script: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
          python3 scripts/name-apks.py app/build/outputs/apk/release MultiGateway.apk
      - name: Publish APKs and SHA-1 checksums to GitHub Release
        ignore_failure: false
        script: |
          set -euo pipefail
          GITHUB_RELEASE_TAG="$(python3 -c 'import json; print(json.load(open("app/build/outputs/apk/release/output-metadata.json"))["elements"][0]["versionName"])')"
          export GITHUB_RELEASE_TAG
          bash scripts/publish-github-release.sh
    artifacts:
      - app/build/outputs/apk/release/MultiGateway.apk
      - app/build/outputs/apk/release/*.sha1
